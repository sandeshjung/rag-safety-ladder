[project]
name = "refuses-to-lie"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sandesh Jung Kunwar", email = "sandeshjung@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "google-genai>=2.24.0",
    "numpy>=2.5.3",
    "pdfplumber>=0.11.10",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
refuses-to-lie = "refuses_to_lie:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "reportlab>=4.0",
    "ruff>=0.16.8",
]
ui = [
    "streamlit>=1.64.0",
]

[tool.ruff]
line-length = 95
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["rank_bm25.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Tests marked `live` call real Gemini/Groq endpoints. They spend free-tier
# quota and fail whenever that quota is exhausted, so the default run skips
# them. Run them deliberately with: uv run pytest -m live
markers = ["live: calls a real LLM provider (spends quota; needs API keys)"]
addopts = "-m 'not live'"
